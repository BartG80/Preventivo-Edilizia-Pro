workflows:
  android-workflow:
    name: Android APK
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Ricrea struttura se manca
        script: |
          ls -la
          # se main.dart è nella root, spostalo in lib/
          mkdir -p lib
          if [ -f main.dart ]; then cp main.dart lib/main.dart; fi
          # se manca android, ricreala
          if [ ! -d android ]; then flutter create . --platforms=android --project-name preventivo_edile; fi
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
