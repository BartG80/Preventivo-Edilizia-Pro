workflows:
  android-workflow:
    name: Android APK
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Proteggi codice e ricrea android
        script: |
          ls -la
          ls -la lib || true
          cp lib/main.dart /tmp/main_backup.dart
          if [ ! -d android ]; then flutter create . --platforms=android --project-name preventivo_edile; fi
          cp /tmp/main_backup.dart lib/main.dart
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
